version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: riglog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: riglog
    ports:
      # Host 5434 → container 5432 to avoid conflicts with other local Postgres instances
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
