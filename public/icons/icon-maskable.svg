<!--
  Maskable PWA icon (manifest `purpose: "maskable"`).

  Android masks an installed icon to whatever shape the launcher uses, so
  this one is a full-bleed square with no corner radius of its own — the
  rounded tile in icon.svg would get masked a second time and read as a
  squircle inside a circle.

  The artwork is scaled to 0.887 so it sits inside the maskable safe
  zone (a centred circle of 40% the icon's width), which is what the
  launcher guarantees not to crop.

  Same artwork as icon.svg — change one, change the other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RigLog">
  <rect width="512" height="512" fill="#2A5D8C"/>
  <g transform="translate(256 256) scale(0.8871) translate(-256 -256)">
<defs>
    <clipPath id="globe">
      <circle cx="256" cy="256" r="186"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="186" fill="#FFFFFF"/>

  <!-- Meridians and latitudes, in a mid steel blue: strong enough to read
       as a globe, light enough that the road stays the subject. The extra
       meridian at rx=160 is what stops the grid looking like a flat cross. -->
  <g transform="translate(256 256)" fill="none" stroke="#7FA6C4" stroke-width="13">
    <line x1="-186" y1="0" x2="186" y2="0"/>
    <ellipse rx="88" ry="186"/>
    <ellipse rx="160" ry="186" opacity="0.55"/>
    <ellipse rx="186" ry="104"/>
  </g>

  <g clip-path="url(#globe)">
    <!-- Darker than the tile, not the same blue: where the road meets the
         globe's edge it has to stay distinct from the background. -->
    <path d="M 176 460 L 244 168 L 268 168 L 336 460 Z" fill="#132A40"/>
    <!-- Centre line. The markings narrow and shorten toward the horizon —
         a constant-width dash reads as a zip, not a road. The horizon sits
         at y=168 rather than nearer the top: taken all the way up, the
         road becomes a narrow spike that skewers the globe and stops
         reading as a road once the icon is 48px. -->
    <g stroke="#FFFFFF" stroke-linecap="butt">
      <line x1="256" y1="438" x2="256" y2="380" stroke-width="16"/>
      <line x1="256" y1="356" x2="256" y2="306" stroke-width="13"/>
      <line x1="256" y1="286" x2="256" y2="244" stroke-width="11"/>
      <line x1="256" y1="228" x2="256" y2="198" stroke-width="8"/>
    </g>
  </g>
  </g>
</svg>
